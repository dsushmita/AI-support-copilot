services:
  postgres:
    image: postgres:16-alpine
    container_name: copilot-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s

  redis:
    image: redis:7-alpine
    container_name: copilot-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: